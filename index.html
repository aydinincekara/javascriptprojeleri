    <style>
        :root {
            --primary-blue: #0ea5e9;
            --primary-pink: #ff007f;
            --primary-yellow: #facc15;
            --primary-green: #10b981;
            --primary-purple: #8b5cf6;
            --dark-navy: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-navy);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(14, 165, 233, 0.05), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.05), transparent 40%);
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
        }

        /* Üst Menü / Kurumsal Header */
        header {
            text-align: center;
            padding: 40px 20px 30px; 
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-family: 'Righteous', cursive;
            font-size: 2.5rem; 
            margin: 0 0 5px 0;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, var(--primary-blue), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-top: 5px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .badge-100 {
            display: inline-block;
            background: var(--primary-pink);
            color: white;
            font-size: 0.8rem;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* Arama Kutusu */
        .search-container {
            max-width: 600px;
            margin: 20px auto 0;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 15px 20px 15px 45px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(15, 23, 42, 0.8);
            color: white;
            font-size: 1rem;
            font-family: 'Nunito', sans-serif;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .search-container input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.3);
        }

        .search-container i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        /* Proje Kartları Alanı */
        .container {
            max-width: 1400px;
            margin: 40px auto 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px;
        }

        /* Profesyonel Kart Tasarımı */
        .project-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 30px 25px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--card-color, var(--primary-blue));
            opacity: 0.8;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: var(--card-color, var(--primary-blue));
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .icon-wrapper {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.05);
            color: var(--card-color, var(--primary-blue));
        }

        .project-number {
            position: absolute;
            top: 20px;
            right: 25px;
            font-weight: 900;
            color: rgba(255,255,255,0.1);
            font-size: 1.5rem;
            font-family: 'Righteous', cursive;
        }

        h2 {
            font-family: 'Righteous', cursive;
            font-size: 1.3rem;
            margin: 0 0 10px 0;
            color: #fff;
        }

        .description {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.5;
            flex-grow: 1;
            margin-bottom: 25px;
        }

        /* Aksiyon Butonu */
        .btn-launch {
            display: block;
            text-align: center;
            background: rgba(255,255,255,0.05);
            color: #fff;
            padding: 12px;
            text-decoration: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .project-card:hover .btn-launch {
            background: var(--card-color, var(--primary-blue));
            color: #fff;
            border-color: transparent;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-weight: 700;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        /* Gizleme Sınıfı (Arama için) */
        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .container { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        }
    </style>
</head>

        const container = document.getElementById('projectContainer');
        const searchInput = document.getElementById('searchInput');

        // Projeleri Ekrana Çizdirme Fonksiyonu
        function renderProjects() {
            container.innerHTML = ''; // Önce temizle
            
            projectsData.forEach((project, index) => {
                // Klasör formatını (proje1, proje2) ayarla
                const folderName = `proje${project.id}`;
                // Sırayla farklı renkler ata
                const themeColor = colors[index % colors.length];

                const cardHTML = `
                    <div class="project-card" style="--card-color: ${themeColor};">
                        <div class="project-number">${project.id < 10 ? '0'+project.id : project.id}</div>
                        <div class="icon-wrapper">
                            <i class="fa-solid ${project.icon}"></i>
                        </div>
                        <h2 class="project-title">${project.title}</h2>
                        <p class="description">${project.desc}</p>
                        <a href="${folderName}/index.html" class="btn-launch">Projeyi Başlat</a>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Arama (Filtreleme) Fonksiyonu
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.project-card');

            cards.forEach(card => {
                const title = card.querySelector('.project-title').innerText.toLowerCase();
                const desc = card.querySelector('.description').innerText.toLowerCase();
                
                if (title.includes(term) || desc.includes(term)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        });

        // Sayfa yüklendiğinde projeleri oluştur
        window.onload = renderProjects;
    </script>
